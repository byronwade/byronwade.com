version: '3.8'

services:
  local-byronwade:
    build:
      context: .
      dockerfile: Dockerfile.local
    container_name: local-byronwade-dev
    restart: unless-stopped
    ports:
      - "3001:3001"
      - "9229:9229"  # Node.js debug port
    environment:
      - NODE_ENV=development
      - PORT=3001
      - HOSTNAME=0.0.0.0
      - NEXT_TELEMETRY_DISABLED=1
      - NEXT_SHARP_PATH=/app/node_modules/sharp
      - NEXT_OPTIMIZE_FONTS=false
      - NEXT_OPTIMIZE_IMAGES=false
      - NEXT_DEBUG=true
    volumes:
      - .:/app
      - /app/node_modules
      - /app/.next
    networks:
      - local-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3001/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  # Optional: Add a local database for development
  local-db:
    image: postgres:15-alpine
    container_name: local-byronwade-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: local_byronwade
      POSTGRES_USER: local_user
      POSTGRES_PASSWORD: local_password
    ports:
      - "5432:5432"
    volumes:
      - local_db_data:/var/lib/postgresql/data
    networks:
      - local-network

  # Optional: Add Redis for caching
  local-redis:
    image: redis:7-alpine
    container_name: local-byronwade-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - local_redis_data:/data
    networks:
      - local-network

networks:
  local-network:
    driver: bridge
    ipam:
      driver: default
      config:
        - subnet: 172.29.0.0/16

volumes:
  local_db_data:
    driver: local
  local_redis_data:
    driver: local
