name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Lint, type-check, dead code, build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      # `type-check` runs `next typegen` first: next-env.d.ts and the generated
      # route types are gitignored, so tsc cannot resolve `next/*` without them.
      - name: Type-check
        run: npm run type-check

      # Fails on unused files, exports, types, and dependencies. This is what
      # keeps deleted features from leaving orphaned modules behind.
      - name: Dead code
        run: npm run knip

      - name: Build
        run: npm run build
